<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veoma Labs — Business Management System</title>
    <script>
      // Auto-redirect if opened via VS Code Live Server or raw file protocol
      if (window.location.port === '5500' || window.location.protocol === 'file:') {
        window.location.href = 'http://localhost:8000';
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #0b1120; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 24px;">
        <div style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 32px; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <div style="font-size: 36px; margin-bottom: 12px;">🚀</div>
          <h2 style="color: #60a5fa; font-size: 22px; font-weight: 700; margin: 0 0 10px 0;">Veoma Labs System</h2>
          <p style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 24px 0;">
            This is a modern React + FastAPI application. VS Code Live Server (port 5500) does not compile TypeScript or run the backend.
            <br/><br/>
            Please open the live application server:
          </p>
          <a href="http://localhost:8000" style="display: inline-block; background: #2563eb; color: #ffffff; padding: 12px 28px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; transition: background 0.2s;">
            Open Veoma Labs App → http://localhost:8000
          </a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
